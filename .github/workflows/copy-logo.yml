name: Copy logo asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download logo
        run: |
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/trixluans23-droid/Gleison-barbearia-2.0/main/file_00000000418c820e9ae7d7eeedbc5a98.png" -o file_00000000418c820e9ae7d7eeedbc5a98.png
          test -s file_00000000418c820e9ae7d7eeedbc5a98.png
      - name: Commit logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add file_00000000418c820e9ae7d7eeedbc5a98.png
          git diff --cached --quiet || git commit -m "Copy Gleison Barbearia logo"
          git push
